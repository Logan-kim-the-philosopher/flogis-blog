apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flogis-blog

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - resource-policy.yaml
  - web.yaml
  - tailscale-gateway.yaml

configMapGenerator:
  - name: flogis-blog-gateway
    files:
      - default.conf=files/gateway.conf
  - name: flogis-blog-runtime
    literals:
      - TS_KUBE_SECRET=flogis-blog-tailscale-state
      - TS_HOSTNAME=flogis-blog
      - TS_ADVERTISE_TAGS=tag:flogis-blog
  - name: flogis-blog-web-runtime
    literals:
      - HOST=0.0.0.0
      - PORT=8080
      - PUBLIC_SITE_URL=https://flogis-blog.tail2dac17.ts.net
      - SANITY_PROJECT_ID=w1jypogd
      - SANITY_DATASET=production
      - SANITY_API_VERSION=2025-08-22
      - SANITY_STRICT_CONTENT=true

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: flogis-blog
    includeSelectors: false
