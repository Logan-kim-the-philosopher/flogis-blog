apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flogis-blog

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - resource-policy.yaml
  - web.yaml
  - tailscale-gateway.yaml

configMapGenerator:
  - name: flogis-blog-gateway
    files:
      - default.conf=files/gateway.conf

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: flogis-blog
    includeSelectors: false
