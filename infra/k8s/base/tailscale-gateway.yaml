apiVersion: apps/v1
kind: Deployment
metadata:
  name: flogis-blog-gateway
  namespace: flogis-blog
  labels:
    app.kubernetes.io/name: flogis-blog
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flogis-blog
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flogis-blog
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: flogis-blog-tailscale
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: nginxinc/nginx-unprivileged:1.27.5-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: gateway-tmp
              mountPath: /tmp
            - name: gateway-cache
              mountPath: /var/cache/nginx
            - name: gateway-run
              mountPath: /var/run
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_KUBE_SECRET
              value: flogis-blog-tailscale-state
            - name: TS_HOSTNAME
              value: flogis-blog
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: flogis-blog-tailscale-auth
                  key: TS_AUTHKEY
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              tailscaled \
                --state=kube:$TS_KUBE_SECRET \
                --socket=/tmp/tailscaled.sock \
                --tun=userspace-networking &

              until [ -S /tmp/tailscaled.sock ]; do sleep 1; done

              tailscale --socket=/tmp/tailscaled.sock up \
                --authkey="$TS_AUTHKEY" \
                --hostname="$TS_HOSTNAME" \
                --accept-dns=true

              tailscale --socket=/tmp/tailscaled.sock serve \
                --bg --yes --https=443 http://127.0.0.1:8080
              tailscale --socket=/tmp/tailscaled.sock serve status

              wait
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale --socket=/tmp/tailscaled.sock status --json >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tailscale-tmp
              mountPath: /tmp
      volumes:
        - name: gateway-config
          configMap:
            name: flogis-blog-gateway
        - name: gateway-tmp
          emptyDir: {}
        - name: gateway-cache
          emptyDir: {}
        - name: gateway-run
          emptyDir: {}
        - name: tailscale-tmp
          emptyDir: {}
